<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة تحكم AI Content Factory</title>
<style>
  :root {
    --bg: #0f1115; --panel: #1a1d24; --border: #2a2e38; --text: #e8e8ec;
    --muted: #9aa0ac; --accent: #4f7cff; --ok: #2ecc71; --err: #e74c3c; --warn: #f1c40f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    margin: 0; line-height: 1.5;
  }
  a { color: inherit; }
  h1 { font-size: 18px; margin: 0; }
  h2 { font-size: 16px; margin: 0 0 10px; color: var(--accent); }
  .sub { color: var(--muted); font-size: 13px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; margin-bottom: 14px;
  }
  label { display: block; font-size: 13px; color: var(--muted); margin: 8px 0 4px; }
  input, textarea, select {
    width: 100%; background: #0d0f13; border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 8px 10px; font-size: 14px; font-family: inherit;
  }
  textarea { min-height: 70px; resize: vertical; }
  button {
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
    padding: 9px 14px; font-size: 13px; cursor: pointer; margin-top: 10px; margin-inline-end: 8px;
  }
  button.secondary { background: #333844; }
  button.danger { background: #7a2a2a; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button:active:not(:disabled) { transform: scale(0.98); }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
  th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  tr.row-selectable { cursor: pointer; }
  tr.row-selectable:hover { background: #232733; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; white-space: nowrap; }
  .pill.ok { background: rgba(46,204,113,.15); color: var(--ok); }
  .pill.err { background: rgba(231,76,60,.15); color: var(--err); }
  .pill.warn { background: rgba(241,196,15,.15); color: var(--warn); }
  .pill.muted { background: rgba(154,160,172,.15); color: var(--muted); }
  .pill-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .status-line { font-size: 13px; margin-top: 8px; white-space: pre-wrap; word-break: break-word; }
  .status-line.ok { color: var(--ok); }
  .status-line.err { color: var(--err); }
  .current { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .current b { color: var(--text); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }

  .topbar {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5;
  }
  .topbar .spacer { flex: 1; }
  .navtabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 16px; background: #14161c; border-bottom: 1px solid var(--border); }
  .navtabs a.tab {
    text-decoration: none; color: var(--muted); font-size: 13px; padding: 7px 12px; border-radius: 6px;
  }
  .navtabs a.tab:hover { background: #1f2330; color: var(--text); }
  .navtabs a.tab.active { background: var(--accent); color: #fff; }
  main.page { padding: 16px; max-width: 1100px; margin: 0 auto; }

  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .stat-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .stat-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .stat-value { font-size: 24px; font-weight: 600; }
  .stat-value.ok { color: var(--ok); }
  .stat-value.err { color: var(--err); }
  .stat-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }

  .pipeline-row { display: flex; gap: 6px; overflow-x: auto; padding: 6px 0 14px; }
  .stage {
    flex: 1; min-width: 120px; background: #12141a; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px; text-align: center; position: relative;
  }
  .stage.stage-done { border-color: var(--ok); }
  .stage.stage-progress { border-color: var(--accent); }
  .stage.stage-error { border-color: var(--err); }
  .stage-name { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .stage-label { font-size: 13px; font-weight: 600; }
  .stage-arrow { align-self: center; color: var(--muted); font-size: 16px; padding: 0 2px; }
  .kv-grid { display: grid; grid-template-columns: 200px 1fr; gap: 6px 12px; font-size: 13px; }
  .kv-grid .k { color: var(--muted); }
  #log { max-height: 180px; overflow-y: auto; font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; color: var(--muted); }
</style>
</head>
<body>

<div class="topbar">
  <h1>AI Content Factory</h1>
  <div id="healthPill" class="pill muted">...</div>
  <div class="spacer"></div>
  <div id="userBadge" class="pill muted">غير مسجّل دخول</div>
  <button class="secondary" id="logoutBtn" onclick="logout()" style="display:none;margin:0">تسجيل خروج</button>
</div>
<nav class="navtabs" id="navtabs" style="display:none"></nav>
<main id="view" class="page"></main>

<script>
const AUTH_KEY = 'cf_auth';
const STATE_KEY = 'cf_pipeline_state';

function getAuth() { try { return JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); } catch (e) { return null; } }
function setAuth(a) { localStorage.setItem(AUTH_KEY, JSON.stringify(a)); }
function clearAuth() { localStorage.removeItem(AUTH_KEY); }
function isAuthed() { const a = getAuth(); return !!(a && a.token && a.expiresAt > Date.now()); }
function getToken() { const a = getAuth(); return a ? a.token : null; }

function getState() { try { return JSON.parse(localStorage.getItem(STATE_KEY) || '{}'); } catch (e) { return {}; } }
function setState(patch) { const s = Object.assign(getState(), patch); localStorage.setItem(STATE_KEY, JSON.stringify(s)); return s; }

function escapeHtml(s) {
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function logLine(msg) {
  const el = document.getElementById('log');
  if (!el) return;
  const time = new Date().toLocaleTimeString('en-GB');
  el.textContent = `[${time}] ${msg}\n` + el.textContent;
}

function setStatus(elId, text, ok) {
  const el = document.getElementById(elId);
  if (!el) return;
  el.textContent = text;
  el.className = 'status-line ' + (ok === true ? 'ok' : ok === false ? 'err' : '');
}

async function api(path, options) {
  options = options || {};
  const headers = options.headers || {};
  const isFormData = options.body instanceof FormData;
  if (!isFormData && options.body) headers['Content-Type'] = 'application/json';
  const token = getToken();
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(path, Object.assign({}, options, { headers }));
  if (res.status === 401) {
    clearAuth();
    location.hash = '#/login';
    router();
    throw new Error('انتهت الجلسة — الرجاء تسجيل الدخول مجددًا');
  }
  let body;
  try { body = await res.json(); } catch (e) { body = null; }
  logLine(`${options.method || 'GET'} ${path} -> ${res.status}`);
  if (!res.ok) {
    const detail = body && body.detail ? (typeof body.detail === 'string' ? body.detail : JSON.stringify(body.detail)) : res.status;
    throw new Error(detail);
  }
  return body;
}

/* ---------- Login ---------- */

function renderLogin(view) {
  view.innerHTML = `
    <div class="card" style="max-width:420px;margin:60px auto">
      <h2>تسجيل الدخول</h2>
      <label>Client ID</label>
      <input id="clientId" value="pilot-operator">
      <label>Client Secret</label>
      <input id="clientSecret" type="password" placeholder="الصق القيمة السرية هنا">
      <button onclick="doLogin()">دخول</button>
      <div id="loginStatus" class="status-line"></div>
    </div>`;
}

async function doLogin() {
  const client_id = document.getElementById('clientId').value.trim();
  const client_secret = document.getElementById('clientSecret').value;
  try {
    const res = await fetch('/auth/token', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ client_id, client_secret }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.status);
    setAuth({ token: data.access_token, expiresAt: Date.now() + data.expires_in * 1000, clientId: client_id });
    location.hash = '#/dashboard';
    router();
  } catch (e) {
    setStatus('loginStatus', 'فشل تسجيل الدخول: ' + e.message, false);
  }
}

function logout() { clearAuth(); location.hash = '#/login'; router(); }

function updateUserBadge() {
  const badge = document.getElementById('userBadge');
  const btn = document.getElementById('logoutBtn');
  const a = getAuth();
  if (a && isAuthed()) {
    badge.textContent = 'مسجّل دخول (' + a.clientId + ')';
    badge.className = 'pill ok';
    btn.style.display = 'inline-block';
  } else {
    badge.textContent = 'غير مسجّل دخول';
    badge.className = 'pill muted';
    btn.style.display = 'none';
  }
}

async function checkHealth() {
  const pill = document.getElementById('healthPill');
  try {
    const res = await fetch('/health');
    const data = await res.json();
    pill.textContent = data.status === 'ok' ? 'الخدمة تعمل' : 'الخدمة متعطلة';
    pill.className = 'pill ' + (data.status === 'ok' ? 'ok' : 'err');
  } catch (e) {
    pill.textContent = 'تعذر الوصول للخدمة';
    pill.className = 'pill err';
  }
}

/* ---------- Router ---------- */

const NAV_ITEMS = [
  ['#/dashboard', 'الرئيسية'],
  ['#/campaigns', 'الحملات'],
  ['#/pipeline', 'خط الإنتاج'],
  ['#/ideas', 'الأفكار'],
  ['#/scripts', 'السكريبتات'],
  ['#/videos', 'المراجعة والنشر'],
  ['#/clips', 'المونتاج التلقائي'],
  ['#/settings', 'الإعدادات'],
];
const ROUTES = {
  '#/login': renderLogin,
  '#/dashboard': renderDashboard,
  '#/campaigns': renderCampaigns,
  '#/pipeline': renderPipeline,
  '#/ideas': renderIdeas,
  '#/scripts': renderScripts,
  '#/videos': renderVideos,
  '#/clips': renderClips,
  '#/settings': renderSettings,
};

function renderNav(current) {
  const nav = document.getElementById('navtabs');
  nav.innerHTML = NAV_ITEMS.map(([href, label]) =>
    `<a class="tab${current === href ? ' active' : ''}" href="${href}">${label}</a>`
  ).join('');
}

async function router() {
  const hash = location.hash || '#/dashboard';
  const authed = isAuthed();
  document.getElementById('navtabs').style.display = authed ? 'flex' : 'none';
  updateUserBadge();
  if (!authed && hash !== '#/login') { location.hash = '#/login'; return; }
  if (authed && hash === '#/login') { location.hash = '#/dashboard'; return; }
  renderNav(hash);
  const view = document.getElementById('view');
  const fn = ROUTES[hash] || renderDashboard;
  try {
    await fn(view);
  } catch (e) {
    view.innerHTML = `<div class="card"><div class="status-line err">خطأ: ${escapeHtml(e.message)}</div></div>`;
  }
  checkHealth();
}
window.addEventListener('hashchange', router);
window.addEventListener('DOMContentLoaded', router);

function goToPipeline(id) {
  setState({ campaignId: id, ideaId: null, scriptId: null, videoId: null });
  location.hash = '#/pipeline';
}

/* ---------- Dashboard ---------- */

async function renderDashboard(view) {
  view.innerHTML = `<div id="dashRoot" class="sub">جارٍ التحميل...</div>`;
  const root = document.getElementById('dashRoot');
  try {
    const health = await fetch('/health').then(r => r.json()).catch(() => ({ status: 'unknown', checks: {} }));
    const [summary, campaigns, videos] = await Promise.all([
      api('/dashboard/summary'),
      api('/campaigns?limit=5'),
      api('/videos?limit=5'),
    ]);
    const statuses = Object.entries(summary.video_counts_by_status || {});
    root.innerHTML = `
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">حالة النظام (/health)</div>
          <div class="stat-value ${health.status === 'ok' ? 'ok' : 'err'}">${escapeHtml(health.status)}</div>
          <div class="stat-sub">DB: ${escapeHtml(health.checks.database || '-')}${health.checks.redis ? ' · Redis: ' + escapeHtml(health.checks.redis) : ''}</div>
        </div>
        <div class="stat-card"><div class="stat-label">عدد الحملات</div><div class="stat-value">${summary.campaign_count}</div></div>
        <div class="stat-card"><div class="stat-label">بانتظار المراجعة</div><div class="stat-value">${summary.pending_review_count}</div></div>
        <div class="stat-card"><div class="stat-label">الربح التقديري</div><div class="stat-value">$${summary.profit_usd.toFixed(2)}</div></div>
      </div>
      <div class="card">
        <h2>حالة خط الإنتاج الحالية (حسب حالة الفيديو)</h2>
        <div class="pill-row">${statuses.length ? statuses.map(([k, v]) => `<span class="pill muted">${escapeHtml(k)}: ${v}</span>`).join('') : '<span class="sub">لا توجد فيديوهات بعد</span>'}</div>
      </div>
      <div class="grid2">
        <div class="card">
          <h2>أحدث الحملات (نشاط حديث)</h2>
          ${campaigns.length ? renderCampaignRows(campaigns) : '<div class="sub">لا توجد حملات بعد — ابدأ من صفحة الحملات</div>'}
        </div>
        <div class="card">
          <h2>أحدث الفيديوهات (نشاط حديث)</h2>
          ${videos.length ? renderVideoRowsCompact(videos) : '<div class="sub">لا توجد فيديوهات بعد</div>'}
        </div>
      </div>`;
    document.querySelectorAll('#dashRoot [data-goto-campaign]').forEach(tr => {
      tr.onclick = () => goToPipeline(parseInt(tr.dataset.gotoCampaign, 10));
    });
  } catch (e) {
    root.innerHTML = `<div class="status-line err">تعذر تحميل لوحة التحكم: ${escapeHtml(e.message)}</div>`;
  }
}

function renderCampaignRows(list) {
  return `<table><thead><tr><th>ID</th><th>الاسم</th><th>الحالة</th></tr></thead><tbody>${
    list.map(c => `<tr class="row-selectable" data-goto-campaign="${c.id}"><td>${c.id}</td><td>${escapeHtml(c.brand_name)}</td><td>${escapeHtml(c.status)}</td></tr>`).join('')
  }</tbody></table>`;
}

function renderVideoRowsCompact(list) {
  return `<table><thead><tr><th>ID</th><th>الحالة</th><th>الإنتاج</th></tr></thead><tbody>${
    list.map(v => `<tr><td>${v.id}</td><td>${escapeHtml(v.status)}</td><td>${escapeHtml(v.render_status)}</td></tr>`).join('')
  }</tbody></table>`;
}

/* ---------- Campaigns ---------- */

async function renderCampaigns(view) {
  view.innerHTML = `
    <div class="card">
      <h2>إنشاء حملة جديدة</h2>
      <div class="grid2">
        <div><label>اسم البراند / الحملة</label><input id="brandName" placeholder="مثال: Acme"></div>
        <div><label>النيتش (اختياري)</label><input id="nicheName" placeholder="مثال: fitness"></div>
      </div>
      <label>CPM (اختياري)</label>
      <input id="cpmRate" type="number" step="0.1" placeholder="مثال: 4.0">
      <button onclick="createCampaign()">إنشاء</button>
      <div id="createCampaignStatus" class="status-line"></div>
    </div>
    <div class="card">
      <h2>الحملات</h2>
      <button class="secondary" onclick="listCampaigns()">تحديث</button>
      <div id="campaignsStatus" class="status-line"></div>
      <table id="campaignsTable"><thead><tr><th>ID</th><th>الاسم</th><th>النيتش</th><th>الحالة</th><th></th></tr></thead><tbody></tbody></table>
    </div>
    <div class="card" id="campaignDetailCard" style="display:none">
      <h2>تفاصيل الحملة</h2>
      <div id="campaignDetailBody" class="kv-grid"></div>
      <button onclick="goToPipelineFromDetail()">الذهاب لخط الإنتاج</button>
    </div>`;
  await listCampaigns();
}

let _campaignsCache = [];
let _detailCampaignId = null;

async function createCampaign() {
  const brand_name = document.getElementById('brandName').value.trim();
  const niche_name = document.getElementById('nicheName').value.trim() || null;
  const cpmVal = document.getElementById('cpmRate').value;
  const cpm_rate = cpmVal ? parseFloat(cpmVal) : null;
  if (!brand_name) { setStatus('createCampaignStatus', 'اسم الحملة مطلوب', false); return; }
  try {
    const data = await api('/campaigns', { method: 'POST', body: JSON.stringify({ brand_name, niche_name, cpm_rate }) });
    setStatus('createCampaignStatus', 'تم إنشاء الحملة رقم ' + data.id, true);
    await listCampaigns();
  } catch (e) {
    setStatus('createCampaignStatus', 'خطأ: ' + e.message, false);
  }
}

async function listCampaigns() {
  try {
    const data = await api('/campaigns?limit=100');
    _campaignsCache = data;
    const tbody = document.querySelector('#campaignsTable tbody');
    tbody.innerHTML = data.map((c, i) =>
      `<tr><td>${c.id}</td><td>${escapeHtml(c.brand_name)}</td><td>${escapeHtml(c.niche_id ?? '-')}</td><td>${escapeHtml(c.status)}</td>` +
      `<td><button class="secondary" data-detail-idx="${i}" style="margin:0">تفاصيل</button> <button data-pipeline-idx="${i}" style="margin:0">خط الإنتاج</button></td></tr>`
    ).join('');
    tbody.querySelectorAll('[data-detail-idx]').forEach(btn => {
      btn.onclick = () => showCampaignDetail(_campaignsCache[parseInt(btn.dataset.detailIdx, 10)]);
    });
    tbody.querySelectorAll('[data-pipeline-idx]').forEach(btn => {
      btn.onclick = () => goToPipeline(_campaignsCache[parseInt(btn.dataset.pipelineIdx, 10)].id);
    });
  } catch (e) {
    setStatus('campaignsStatus', 'تعذر تحميل القائمة: ' + e.message, false);
  }
}

function showCampaignDetail(c) {
  _detailCampaignId = c.id;
  document.getElementById('campaignDetailCard').style.display = 'block';
  document.getElementById('campaignDetailBody').innerHTML = `
    <div class="k">ID</div><div>${c.id}</div>
    <div class="k">الاسم</div><div>${escapeHtml(c.brand_name)}</div>
    <div class="k">الحالة</div><div>${escapeHtml(c.status)}</div>
    <div class="k">CPM</div><div>${c.cpm_rate ?? '-'}</div>
    <div class="k">سقف الميزانية</div><div>${c.budget_cap ?? '-'}</div>
    <div class="k">يسمح بمحتوى AI</div><div>${c.ai_content_allowed ? 'نعم' : 'لا'}</div>
    <div class="k">تاريخ الإنشاء</div><div>${escapeHtml(c.created_at)}</div>
    <div class="k">آخر تقييم</div><div>${c.latest_score ? escapeHtml(c.latest_score.recommendation || '-') : '-'}</div>`;
}

function goToPipelineFromDetail() { if (_detailCampaignId) goToPipeline(_detailCampaignId); }

/* ---------- Campaign Pipeline (visual workflow) ---------- */

function campaignPicker() {
  return `<div class="card">
    <h2>اختر حملة</h2>
    <div class="sub">لا توجد حملة محددة حاليًا.</div>
    <table><thead><tr><th>ID</th><th>الاسم</th><th></th></tr></thead><tbody id="pickerBody"></tbody></table>
  </div>`;
}

async function renderPipeline(view) {
  const st = getState();
  if (!st.campaignId) {
    view.innerHTML = campaignPicker();
    try {
      const list = await api('/campaigns?limit=50');
      const tbody = document.getElementById('pickerBody');
      tbody.innerHTML = list.map((c, i) => `<tr><td>${c.id}</td><td>${escapeHtml(c.brand_name)}</td><td><button data-pick-idx="${i}" style="margin:0">اختيار</button></td></tr>`).join('');
      tbody.querySelectorAll('[data-pick-idx]').forEach(btn => {
        btn.onclick = () => goToPipeline(list[parseInt(btn.dataset.pickIdx, 10)].id);
      });
    } catch (e) { /* picker best-effort */ }
    return;
  }

  view.innerHTML = `<div class="card"><div class="sub">جارٍ تحميل حالة خط الإنتاج...</div></div>`;
  try {
    const campaign = await api(`/campaigns/${st.campaignId}`);
    const briefs = await api(`/campaigns/${st.campaignId}/research?limit=10`);
    const ideas = await api(`/campaigns/${st.campaignId}/ideas?limit=100`);
    const selectedIdeas = ideas.filter(i => i.status === 'selected');
    let scripts = [];
    for (const idea of selectedIdeas) {
      const s = await api(`/ideas/${idea.id}/scripts?limit=50`).catch(() => []);
      scripts = scripts.concat(s);
    }
    const scriptIds = new Set(scripts.map(s => s.id));
    const allVideos = await api('/videos?limit=200').catch(() => []);
    const videos = allVideos.filter(v => v.script_id && scriptIds.has(v.script_id));
    const publications = await api('/publications?limit=200').catch(() => []);
    const pubs = publications.filter(p => p.campaign_id === st.campaignId);

    const researchStage = briefs.some(b => b.status === 'completed') ? 'done'
      : briefs.length ? 'progress' : 'pending';
    const ideasStage = ideas.length === 0 ? 'pending' : (selectedIdeas.length ? 'done' : 'progress');
    const scriptStage = scripts.length === 0 ? (selectedIdeas.length ? 'pending' : 'pending') : 'done';
    const renderedVideos = videos.filter(v => v.render_status === 'completed');
    const renderStage = videos.length === 0 ? 'pending' : (renderedVideos.length ? 'done' : 'progress');
    const approvedVideos = videos.filter(v => v.status === 'approved' || v.status === 'published');
    const reviewStage = videos.length === 0 ? 'pending' : (approvedVideos.length ? 'done' : (videos.some(v => v.status === 'pending_review') ? 'progress' : 'pending'));
    const publishedPubs = pubs.filter(p => p.status === 'published');
    const publishStage = pubs.length === 0 ? 'pending' : (publishedPubs.length ? 'done' : 'progress');

    const stages = [
      { name: 'الحملة', cls: 'done', label: campaign.status },
      { name: 'البحث', cls: researchStage, label: briefs.length ? `${briefs.length} تقرير` : 'لم يبدأ' },
      { name: 'الأفكار', cls: ideasStage, label: ideas.length ? `${ideas.length} فكرة (${selectedIdeas.length} مختارة)` : 'لا يوجد' },
      { name: 'السكريبت', cls: scriptStage, label: scripts.length ? `${scripts.length} سكريبت` : 'لا يوجد' },
      { name: 'الإنتاج', cls: renderStage, label: videos.length ? `${renderedVideos.length}/${videos.length} مكتمل` : 'لا يوجد' },
      { name: 'المراجعة', cls: reviewStage, label: videos.length ? `${approvedVideos.length} معتمد` : 'لا يوجد' },
      { name: 'النشر', cls: publishStage, label: pubs.length ? `${publishedPubs.length}/${pubs.length} منشور فعليًا` : 'لا يوجد' },
    ];
    const stageClass = { done: 'stage-done', progress: 'stage-progress', pending: '', error: 'stage-error' };

    view.innerHTML = `
      <div class="current">الحملة الحالية: <b>#${campaign.id} (${escapeHtml(campaign.brand_name)})</b> — <a href="#/campaigns">تغيير</a></div>
      <div class="card">
        <h2>خط الإنتاج المرئي</h2>
        <div class="pipeline-row">
          ${stages.map((s, i) => `<div class="stage ${stageClass[s.cls]}"><div class="stage-name">${s.name}</div><div class="stage-label">${escapeHtml(s.label)}</div></div>${i < stages.length - 1 ? '<div class="stage-arrow">←</div>' : ''}`).join('')}
        </div>
        <div class="sub">الأخضر = مكتمل، الأزرق = قيد التنفيذ، الرمادي = لم يبدأ بعد.</div>
      </div>

      <div class="card">
        <h2>البحث (Research)</h2>
        <textarea id="rawNotes" placeholder="ملاحظات عن المنافسين (اختياري)"></textarea>
        <button onclick="runResearch(${campaign.id})">تشغيل البحث بالذكاء الاصطناعي</button>
        <button class="secondary" onclick="location.hash='#/pipeline'">تحديث الحالة</button>
        <div id="researchStatus" class="status-line"></div>
      </div>
      <div class="card">
        <div class="sub">تابع الأفكار والسكريبتات والفيديوهات من صفحاتها المخصصة عبر القائمة العلوية — تم تحديد هذه الحملة كسياق حالي لتلك الصفحات.</div>
        <button class="secondary" onclick="location.hash='#/ideas'">الذهاب لصفحة الأفكار</button>
      </div>`;
  } catch (e) {
    view.innerHTML = `<div class="card"><div class="status-line err">تعذر تحميل خط الإنتاج: ${escapeHtml(e.message)}</div></div>`;
  }
}

let _ideasCache = [];

async function loadIdeas(campaignId) {
  try {
    const data = await api(`/campaigns/${campaignId}/ideas?limit=100`);
    _ideasCache = data;
    const tbody = document.getElementById('ideasTbody');
    tbody.innerHTML = data.map((i, idx) => `<tr>

      <td>
        <button data-select-idx="${idx}" style="margin:0" ${i.status !== 'proposed' ? 'disabled' : ''}>اختيار</button>
        <button class="danger" data-reject-idx="${idx}" style="margin:0" ${i.status !== 'proposed' ? 'disabled' : ''}>رفض</button>
      </td></tr>`).join('') || '<tr><td colspan="5" class="sub">لا توجد أفكار بعد — شغّل البحث من خط الإنتاج أو أضف فكرة يدويًا.</td></tr>';

      btn.onclick = () => selectIdea(_ideasCache[parseInt(btn.dataset.selectIdx, 10)].id);

      btn.onclick = () => rejectIdea(_ideasCache[parseInt(btn.dataset.rejectIdx, 10)].id);

async function createIdea(campaignId) {
  const concept_summary = document.getElementById('conceptSummary').value.trim();

  try {
    const data = await api(`/campaigns/${campaignId}/ideas`, { method: 'POST', body: JSON.stringify({ concept_summary }) });
    setStatus('createIdeaStatus', 'تم إنشاء الفكرة رقم ' + data.id, true);
    await loadIdeas(campaignId);
  } catch (e) {
    setStatus('createIdeaStatus', 'خطأ: ' + e.message, false);
  }
}

async function selectIdea(ideaId) {
  try {
    setStatus('ideasCascadeStatus', 'جارٍ اختيار الفكرة وتوليد السكريبت والفيديو تلقائيًا...', null);
    const data = await api(`/ideas/${ideaId}/select`, { method: 'POST', body: JSON.stringify({}) });
    const patch = { ideaId: data.idea.id };
    if (data.scripts && data.scripts.length) patch.scriptId = data.scripts[0].id;
    if (data.video) patch.videoId = data.video.id;
    setState(patch);
    setStatus('ideasCascadeStatus', `المرحلة: ${data.stage_reached}\n${data.detail}`, true);
    await loadIdeas(getState().campaignId);
  } catch (e) {
    setStatus('ideasCascadeStatus', 'خطأ: ' + e.message, false);

}

async function rejectIdea(ideaId) {
  try {
    await api(`/ideas/${ideaId}/reject`, { method: 'POST' });

}

async function loadPendingReview() {
  try {

    tbody.innerHTML = data.map((v, idx) => `<tr>

function openReview(video) {
  _reviewVideoId = video.id;
  document.getElementById('reviewCard').style.display = 'block';
  document.getElementById('reviewVideoLabel').textContent = '#' + video.id;
  document.getElementById('publishCard').style.display = 'block';
  document.getElementById('publishVideoLabel').textContent = '#' + video.id;
  document.getElementById('reviewCard').scrollIntoView({ behavior: 'smooth' });
}

async function submitReview() {
  if (!_reviewVideoId) { setStatus('reviewStatus', 'اختر فيديو أولًا', false); return; }
  const decision = document.getElementById('reviewDecision').value;
  const reason_code = document.getElementById('reasonCode').value.trim() || null;
  const notes = document.getElementById('reviewNotes').value.trim() || null;
  try {
    const data = await api(`/videos/${_reviewVideoId}/review`, { method: 'POST', body: JSON.stringify({ decision, reason_code, notes }) });
    let msg = 'تم تسجيل القرار: ' + data.decision;
    if (data.auto_publish_status) msg += `\nالنشر التلقائي: ${data.auto_publish_status} — ${data.auto_publish_detail || ''}`;
    if (data.auto_metrics_status) msg += `\nمزامنة المقاييس: ${data.auto_metrics_status} — ${data.auto_metrics_detail || ''}`;
    setStatus('reviewStatus', msg, true);
    await loadPendingReview();
    await loadAllVideos();
  } catch (e) {
    setStatus('reviewStatus', 'خطأ: ' + e.message, false);
  }
}

async function publishVideo() {
  if (!_reviewVideoId) { setStatus('publishStatus', 'اختر فيديو أولًا', false); return; }
  const account_id = parseInt(document.getElementById('publishAccountId').value, 10);
  const title = document.getElementById('publishTitle').value.trim();
  const description = document.getElementById('publishDescription').value.trim();
  if (!account_id || !title) { setStatus('publishStatus', 'account_id والعنوان مطلوبان', false); return; }
  try {
    const data = await api(`/videos/${_reviewVideoId}/publish`, { method: 'POST', body: JSON.stringify({ account_id, title, description }) });
    setStatus('publishStatus', 'الحالة: ' + data.status + (data.status === 'scheduled' ? ' (بانتظار نشر حقيقي — لا يوجد حساب منصة حقيقي متصل بعد)' : ''), true);
  } catch (e) {
    setStatus('publishStatus', 'خطأ: ' + e.message, false);
  }
}

async function uploadSourceVideo() {
  const title = document.getElementById('sourceVideoTitle').value.trim();
  const file = document.getElementById('sourceVideoFile').files[0];
  if (!title || !file) { setStatus('sourceVideoStatus', 'العنوان والملف مطلوبان', false); return; }
  try {
    setStatus('sourceVideoStatus', 'جارٍ الرفع...', null);
    const form = new FormData();
    form.append('title', title);
    form.append('file', file);
    const data = await api('/source-videos', { method: 'POST', body: form });
    setStatus('sourceVideoStatus', 'تم رفع الفيديو رقم ' + data.id, true);
    await listSourceVideos();
  } catch (e) {
    setStatus('sourceVideoStatus', 'خطأ: ' + e.message, false);
  }
}

async function listSourceVideos() {
  try {
    const data = await api('/source-videos?limit=50');
    _sourceVideosCache = data;
    const tbody = document.getElementById('sourceVideosTbody');
    tbody.innerHTML = data.map((v, idx) =>
      `<tr><td>${v.id}</td><td>${escapeHtml(v.title)}</td><td>${escapeHtml(v.transcription_status)}</td><td><button data-pick-sv-idx="${idx}" style="margin:0">اختيار</button></td></tr>`
    ).join('') || '<tr><td colspan="4" class="sub">لا توجد فيديوهات مرفوعة بعد</td></tr>';
    tbody.querySelectorAll('[data-pick-sv-idx]').forEach(btn => {
      btn.onclick = () => selectSourceVideo(_sourceVideosCache[parseInt(btn.dataset.pickSvIdx, 10)]);
    });
  } catch (e) {
    setStatus('sourceVideoStatus', 'تعذر تحميل القائمة: ' + e.message, false);
  }
}

function selectSourceVideo(v) {
  _curSourceVideoId = v.id;
  document.getElementById('clipWorkCard').style.display = 'block';
  document.getElementById('curSourceVideo').textContent = `#${v.id} (${v.title})`;
}

async function transcribeSourceVideo() {
  if (!_curSourceVideoId) { setStatus('analyzeStatus', 'اختر فيديو أولًا', false); return; }
  try {
    setStatus('analyzeStatus', 'جارٍ تفريغ الصوت نصيًا...', null);
    const data = await api(`/source-videos/${_curSourceVideoId}/transcribe`, { method: 'POST', body: JSON.stringify({}) });
    setStatus('analyzeStatus', 'اكتمل: ' + data.transcription_status, true);
  } catch (e) {
    setStatus('analyzeStatus', 'خطأ: ' + e.message, false);
  }
}

async function analyzeSourceVideo() {
  if (!_curSourceVideoId) { setStatus('analyzeStatus', 'اختر فيديو أولًا', false); return; }
  try {
    setStatus('analyzeStatus', 'جارٍ التحليل واختيار أفضل اللقطات...', null);
    const data = await api(`/source-videos/${_curSourceVideoId}/analyze`, { method: 'POST', body: JSON.stringify({ max_clips: 5 }) });
    _clipsCache = data;
    setStatus('analyzeStatus', 'تم اقتراح ' + data.length + ' مقطع', true);
    const tbody = document.getElementById('clipsTbody');
    tbody.innerHTML = data.map((c, idx) =>
      `<tr><td>${c.id}</td><td>${c.start_s.toFixed(1)}s</td><td>${c.end_s.toFixed(1)}s</td><td>${escapeHtml(c.hook_text || '')}</td><td>${c.predicted_score ?? ''}</td>` +
      `<td><button data-clip-idx="${idx}" style="margin:0">قصّ وترجمة</button></td></tr>`
    ).join('');
    tbody.querySelectorAll('[data-clip-idx]').forEach(btn => {
      btn.onclick = () => renderClip(_clipsCache[parseInt(btn.dataset.clipIdx, 10)].id);
    });
  } catch (e) {
    setStatus('analyzeStatus', 'خطأ: ' + e.message, false);
  }
}

async function renderClip(clipId) {
  try {
    setStatus('clipRenderStatus', 'جارٍ قصّ المقطع وإضافة الترجمة...', null);
    const data = await api(`/clips/${clipId}/render`, { method: 'POST', body: JSON.stringify({}) });
    setState({ videoId: data.id });
    setStatus('clipRenderStatus', `تم — الحالة: ${data.render_status}، الملف: ${data.asset_url}. تابع المراجعة والنشر من صفحة "المراجعة والنشر".`, true);
  } catch (e) {
    setStatus('clipRenderStatus', 'خطأ: ' + e.message, false);
  }
}
</script>
</body>
</html>
