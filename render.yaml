# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploys this repo's existing, already-CI-verified Dockerfile as-is: no
# separate Build/Start Command, Render builds and runs the image exactly
# as `docker build .` / `docker run <image> serve` already do locally and
# in CI (see .github/workflows/ci.yml's "Build container image" job).
# Provisions a managed Postgres instance via the "databases" block below
# so DATABASE_URL is wired automatically instead of typed in by hand.
#
# NOTE ON VERIFICATION: this file was written from Render's long-stable,
# publicly documented Blueprint spec keys (env: docker, dockerfilePath,
# dockerContext, healthCheckPath, preDeployCommand, generateValue, sync:
# false). It could NOT be validated against Render's live schema in this
# environment — render.com's own egress is blocked by this sandbox's
# session policy (confirmed via the same proxy-status check already
# documented for Groq in docs/PILOT_ENVIRONMENT_STATUS.md — a 403 policy
# denial, not a code problem). Apply this via Render's "New +" -> "Blueprint"
# flow; if Render's own validator rejects any key, that error is the
# authority, not this comment — report it back for a fix rather than
# assuming this file is correct sight unseen.
#
# Migrations: preDeployCommand below runs `alembic upgrade head` once per
# deploy, after a successful build, before the new version receives
# traffic - this is the preferred mechanism where it's supported. Free/
# starter web services don't reliably support preDeployCommand (and can't
# run a one-off `migrate` Docker Command either - a command that runs
# alembic and exits gets treated as a crashed deploy, since the platform
# expects the container to stay up and bind $PORT). RUN_MIGRATIONS_ON_START
# below is docker-entrypoint.sh's opt-in fallback for exactly that case:
# `serve` runs `alembic upgrade head` itself before starting uvicorn. This
# is only safe for a single-instance deployment (see docker-entrypoint.sh's
# comment on the multi-replica race it would otherwise reintroduce) - this
# service has no autoscaling/multiple instances configured, so it's safe
# here. If this service is ever scaled to multiple instances, remove this
# env var and rely on preDeployCommand (or a one-off Job) instead.

databases:
  - name: content-factory-db
    plan: starter
    postgresMajorVersion: "16"

services:
  - type: web
    name: content-factory
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: claude/ai-automation-architecture-lsddgf
    healthCheckPath: /health
    preDeployCommand: "alembic upgrade head"
    # Real production gap this closes: without a Disk, this service's
    # local filesystem is ephemeral - every redeploy/restart gets a brand
    # new container with an empty filesystem, silently wiping any raw
    # source video already downloaded (via upload or the Content Rewards
    # connector) before it ever reaches transcribe/analyze/render. This
    # was hit for real: 3 videos ingested via sync-content-rewards.yml
    # all failed transcription with FileNotFoundError minutes later,
    # right after a routine PR merge triggered a redeploy. The rendered
    # *output* clips already survive this via MEDIA_BACKUP_* (S3/Supabase)
    # above - raw source videos had no equivalent. MEDIA_STORAGE_DIR below
    # points at this disk's mount path so every write under it persists
    # across restarts/redeploys.
    #
    # IMPORTANT (could not be verified in this sandbox - render.com egress
    # is blocked here, same caveat as the rest of this file): Render Disks
    # require a paid instance type - the free instance plan does not
    # support attaching a Disk at all. If this service is still on Free,
    # applying this Blueprint will surface that as a real error from
    # Render itself; upgrading the instance type is a cost decision only
    # you can make, not something to route around.
    disk:
      name: content-factory-media
      mountPath: /var/media
      sizeGB: 10
    envVars:
      - key: MEDIA_STORAGE_DIR
        value: "/var/media"
      - key: ENVIRONMENT
        value: "production"
      - key: DATABASE_URL
        fromDatabase:
          name: content-factory-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: AUTH_CLIENT_ID
        value: "pilot-operator"
      - key: AUTH_CLIENT_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      # LLM provider — exactly one of the two blocks below is active,
      # selected by LLM_PROVIDER. Both keys are `sync: false`: Render will
      # prompt you to enter the real value once in its dashboard: it is
      # never written into this file or committed to git.
      - key: LLM_PROVIDER
        value: "anthropic"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: "claude-sonnet-5"
      - key: ANTHROPIC_MODEL_VERSION
        value: "2026-02-01"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "llama-3.3-70b-versatile"
      # Safe defaults — unchanged from the app's own fallback behavior;
      # listed explicitly so they're visible/editable in Render's
      # dashboard rather than silently relying on Settings' own defaults.
      - key: TTS_PROVIDER
        value: "silent"
      - key: RENDERER_BACKEND
        value: "null"
      # Clip Factory pipeline (long video -> transcript -> AI-selected clips
      # -> real ffmpeg cut+captions+hook -> publish) - the project's single
      # current priority. Both httpx (transcription) and imageio-ffmpeg/
      # Pillow (rendering) are already in requirements-lock.txt, so nothing
      # else needs installing - these two vars were simply never set here,
      # which silently left the live site on NullTranscriptionProvider
      # (returns an empty transcript) and NullClipRenderer (writes a JSON
      # manifest instead of cutting real video) - i.e. the entire mandated
      # pipeline could never produce a real, publishable clip in production
      # regardless of anything else working correctly.
      - key: TRANSCRIPTION_PROVIDER
        value: "groq"
      - key: CLIP_RENDERER_BACKEND
        value: "ffmpeg"
      - key: RUN_MIGRATIONS_ON_START
        value: "true"
      # Public asset hosting (Pilot priority #1 - see services/media_backup.py).
      # Bucket: Supabase Storage (S3-compatible), project oidhfzckpnbpnlofmwnh,
      # bucket content-factory-media, public-bucket reads confirmed reachable
      # (a real uploaded object's public URL round-tripped 2026-07-28).
      # AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY (boto3's own standard env
      # vars, not custom keys here) must still be added as `sync: false`
      # secrets in Render's dashboard - never committed to git.
      - key: MEDIA_BACKUP_ENABLED
        value: "true"
      - key: MEDIA_BACKUP_S3_BUCKET
        value: "content-factory-media"
      - key: MEDIA_BACKUP_S3_ENDPOINT_URL
        value: "https://oidhfzckpnbpnlofmwnh.storage.supabase.co/storage/v1/s3"
      - key: MEDIA_BACKUP_PUBLIC_BASE_URL
        value: "https://oidhfzckpnbpnlofmwnh.supabase.co/storage/v1/object/public/content-factory-media"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: PUBLISHING_ENABLED
        value: "true"
      # Per-platform "this integration is deliberately turned on" gate
      # (publishing/factory.py's _PLATFORM_CREDENTIAL_CHECK, mirrored in
      # analytics_ingestion/factory.py) - real credentials are declared
      # here without a value: without this, get_publishing_provider falls
      # back to ManualPublishingProvider (and metrics sync to
      # ManualAnalyticsProvider) for Instagram forever, regardless of
      # whether a real, working access token is ever stored on an
      # OwnedAccount row via the dashboard/API - i.e. the actual "نشره"
      # stage could reach a Publication row but never a real platform
      # call. A real Meta Developer App (the one the IG access token
      # itself came from) already has these two values - add them as
      # secrets in Render's dashboard.
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: RATE_LIMIT_BACKEND
        value: "memory"
      - key: METRICS_ENABLED
        value: "true"
