[project]
name = "content-factory"
version = "0.1.0"
description = "AI Content Factory — Phase 1 MVP (Whop Content Rewards content pipeline)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg2-binary>=2.9",
    "structlog>=24.1",
    "anthropic>=0.34",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
# Optional rendering backend. Core business logic never imports these
# directly (see video_production/renderer/providers/template_pillow.py) —
# without this extra installed, the system falls back to the NullRenderer.
rendering = [
    "Pillow>=10.3",
    "imageio-ffmpeg>=0.5",
]
elevenlabs = [
    "httpx>=0.27",
]
# Optional Slack notification backend (Phase 2 M1). Without this extra
# installed, NOTIFICATION_PROVIDER=slack falls back to LogNotificationProvider
# (see notifications/factory.py) — never a hard import-time failure.
notifications = [
    "httpx>=0.27",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
